<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="240" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5"/>

  <!-- Decorative terminal grid background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240" />
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
  </g>

  <!-- Icon: Token comparison visual -->
  <g transform="translate(60, 60)">
    <circle cx="60" cy="60" r="54" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M45 42 L75 42 L60 78 Z" fill="#38bdf8" opacity="0.9"/>
    <path d="M45 78 L75 78 L60 42 Z" fill="#818cf8" opacity="0.4"/>
    <circle cx="60" cy="60" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="60" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">&Delta;</text>
  </g>

  <!-- Titles -->
  <text x="200" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accentGradient)" letter-spacing="-0.5">token-diff</text>
  <text x="202" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Deterministic Token Usage Measurement &amp; Context Diff Infrastructure</text>

  <!-- Badges / Tech tags in SVG -->
  <g transform="translate(202, 172)">
    <!-- TypeScript Badge -->
    <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#3b82f6"/>
    <text x="24" y="17" font-family="monospace" font-size="12" font-weight="bold" fill="#e2e8f0">TypeScript</text>

    <!-- Node.js Badge -->
    <rect x="115" y="0" width="90" height="26" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <circle cx="127" cy="13" r="4" fill="#22c55e"/>
    <text x="139" y="17" font-family="monospace" font-size="12" font-weight="bold" fill="#e2e8f0">Node.js</text>

    <!-- CLI Badge -->
    <rect x="215" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <circle cx="227" cy="13" r="4" fill="#a855f7"/>
    <text x="239" y="17" font-family="monospace" font-size="12" font-weight="bold" fill="#e2e8f0">CLI &amp; SDK</text>

    <!-- tiktoken Badge -->
    <rect x="330" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="342" cy="13" r="4" fill="#f59e0b"/>
    <text x="354" y="17" font-family="monospace" font-size="12" font-weight="bold" fill="#e2e8f0">tiktoken</text>
  </g>
</svg>
